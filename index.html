<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaña Navideña Cambrune 2026</title>
<meta name="description" content="II Jornada Médica Estudiantil de Proyección Social 2026 – C.P. Cambrune. Un pequeño aporte, una gran sonrisa.">
<meta property="og:title" content="Campaña Navideña Cambrune 2026">
<meta property="og:description" content="Un pequeño aporte, una gran sonrisa. Conoce la campaña y dona.">
<style>
  html,body{margin:0;background:#f7f1e7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d4d3a}
  #cargando{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
  .anillo{width:46px;height:46px;border-radius:50%;border:4px solid #e7d9bf;border-top-color:#9e1a2f;animation:g 0.9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #cargando b{font-size:1.15rem}
  #cargando a{color:#9e1a2f;font-weight:600}
</style>
</head>
<body>
<div id="cargando">
  <div class="anillo" aria-hidden="true"></div>
  <b>Campaña Navideña Cambrune 2026</b>
  <span id="estado">Cargando la campaña…</span>
</div>
<script>
/*
 * Esta página solo "trae" la portada real desde Apps Script.
 * Pide el diseño y los datos SIN enviar las cuentas de Google del visitante
 * (credentials: 'omit'), así funciona aunque el celular tenga varias cuentas.
 * No hace falta volver a subir este archivo cuando cambie la portada.
 */
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbz2N7O13kHE3g8svoV0wkAgFYCXk-V0bXTn8QmcfBajObSODB8umo_8LS7tPCkwl5A/exec';
  var previo = null;

  function llamar(nombre, args) {
    var url = API + '?api=' + encodeURIComponent(nombre) + '&args=' + encodeURIComponent(JSON.stringify(args || []));
    return fetch(url, {credentials: 'omit', redirect: 'follow'})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error del servidor'); return j.r; });
  }

  // Imita google.script.run para que la portada funcione igual que en Apps Script.
  function corredor(ok, falla) {
    return new Proxy({}, {get: function (_, k) {
      if (k === 'withSuccessHandler') return function (f) { return corredor(f, falla); };
      if (k === 'withFailureHandler') return function (f) { return corredor(ok, f); };
      if (k === 'withUserObject') return function () { return corredor(ok, falla); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        var p = (k === 'getPublic' && previo) ? Promise.resolve(previo) : llamar(k, args);
        if (k === 'getPublic') previo = null;
        p.then(function (r) { if (ok) ok(r); }, function (e) { if (falla) falla(e); });
      };
    }});
  }

  function fallo() {
    document.getElementById('estado').innerHTML =
      'No se pudo cargar la página. Revisa tu conexión y <a href="">vuelve a intentarlo</a>.';
  }

  var intentos = 0;
  function cargar() {
    llamar('portada').then(function (r) {
      previo = r.datos || null;
      window.google = {script: {run: corredor(null, null)}};
      document.open();
      document.write(r.html);
      document.close();
      document.title = 'Campaña Navideña Cambrune 2026';
      if (r.logo) {
        var l = document.createElement('link'); l.rel = 'icon'; l.href = r.logo;
        (document.head || document.documentElement).appendChild(l);
      }
    }).catch(function () {
      if (++intentos < 3) setTimeout(cargar, 1500); else fallo();
    });
  }
  cargar();
})();
</script>
</body>
</html>
