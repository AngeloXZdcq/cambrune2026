<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaña Navideña Cambrune 2026</title>
<meta name="description" content="II Jornada Médica Estudiantil de Proyección Social 2026 – C.P. Cambrune. Un pequeño aporte, una gran sonrisa.">
<meta property="og:title" content="Campaña Navideña Cambrune 2026">
<meta property="og:description" content="Un pequeño aporte, una gran sonrisa. Conoce la campaña y dona.">
<style>
  html,body{margin:0;background:#f7f1e7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d4d3a}
  #cargando{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
  .anillo{width:46px;height:46px;border-radius:50%;border:4px solid #e7d9bf;border-top-color:#9e1a2f;animation:g 0.9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #cargando b{font-size:1.15rem}
  #cargando a{color:#9e1a2f;font-weight:600}
</style>
</head>
<body>
<div id="cargando">
  <div class="anillo" aria-hidden="true"></div>
  <b>Campaña Navideña Cambrune 2026</b>
  <span id="estado">Cargando…</span>
</div>
<script>
/*
 * Esta página no tiene contenido propio: trae desde Apps Script la página real
 * (portada, o el panel con ?page=panel / ?page=nueva) ya lista para funcionar.
 * Todo se pide SIN las cuentas de Google del visitante, así abre aunque el
 * celular tenga varias cuentas. No hace falta volver a subir este archivo.
 */
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbz2N7O13kHE3g8svoV0wkAgFYCXk-V0bXTn8QmcfBajObSODB8umo_8LS7tPCkwl5A/exec';
  var pagina = (/[?&]page=(\w+)/.exec(location.search) || [])[1] || '';
  var intentos = 0;

  function cargar() {
    fetch(API + '?api=pagina&args=' + encodeURIComponent(JSON.stringify([pagina])), {credentials: 'omit', redirect: 'follow'})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error);
        document.open();
        document.write(j.r.html);
        document.close();
        document.title = j.r.titulo || document.title;
      })
      .catch(function () {
        if (++intentos < 3) return setTimeout(cargar, 1500);
        document.getElementById('estado').innerHTML =
          'No se pudo cargar. Revisa tu conexión y <a href="">vuelve a intentarlo</a>.';
      });
  }
  cargar();
})();
</script>
</body>
</html>
